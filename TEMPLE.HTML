<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beach Images</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
        background-color: #f4f4f4;
    }
    h2 {
        color: #333;
    }
    .image-gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        padding: 10px;
    }
    .image-gallery img {
        width: 100%;
        max-width: 400px;
        height: auto;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease;
    }
    .image-gallery img:hover {
        transform: scale(1.05);
    }
    a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #007BFF;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 16px;
    }
    a:hover {
        background-color: #0056b3;
    }
</style>
</head>
<body>
    <h2>Beautiful TEMPLES</h2>
    <div class="image-gallery">
        <img src="https://www.entertales.com/wp-content/uploads/temple.jpg" alt="TEMPLE OF BUDDA">
        <img src="https://static.toiimg.com/thumb/msid-46918916,width=1200,height=900/46918916.jpg" alt="TEMPLE2">
        <img src="https://media.architecturaldigest.com/photos/5abaa411fa5f8f776ce61b35/master/w_1600%2Cc_limit/Meenakshi%252520Temple%252520-%252520credit%252520Naya%252520Traveler.jpg" alt="SOUTH TEMPLE3">
        <img src="https://wallpaperaccess.com/full/505103.jpg" alt="Beach View 4">
    </div>
    <a href="html1.html">Back to Home</a>  <!-- Button to go back -->
</body>
</html>
