<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        .booking-container {
            margin: 20px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .booking-container h2 {
            color: #333;
            margin-bottom: 15px;
        }
        .image-gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .image-card {
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .image-card:hover {
            transform: scale(1.05);
        }
        .image-card img {
            width: 200px;
            height: auto;
            border-radius: 10px;
        }
        .book-now {
            display: block;
            margin: 10px auto;
            padding: 10px 20px;
            background: #042160;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .book-now:hover {
            background: #df12df;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 300px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);
        }
        .modal-content h2 {
            margin-bottom: 15px;
            color: #444;
        }
        .close {
            float: right;
            font-size: 20px;
            cursor: pointer;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #0d2c4d;
            color: white;
            border: none;
            font-weight: bold;
        }
        button:hover {
            background: #04274d;
        }
    </style>
</head>
<body>
    <div class="booking-container">
        <h2>Book Your Memories</h2>
        <p>Choose your perfect Destinations and book with ease!</p>
        <div class="image-gallery">
            <div class="image-card">
                <img src="https://th.bing.com/th/id/OIP.dMoKq84Q6f50-VaShKhitAHaHa?rs=1&pid=ImgDetMain" alt="Tour 1">
                <p>Explore the stunning landscapes and immerse in the beauty of nature.</p>
                <button class="book-now" onclick="openPaymentModal()">Book Now</button>
            </div>
        </div>
    </div>
    
    <!-- Payment Modal -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closePaymentModal()">&times;</span>
            <h2>Payment Details</h2>
            <p>Secure your booking by entering your payment details below.</p>
            <form>
                <label for="cardNumber">Card Number</label>
                <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456">
                
                <label for="expiry">Expiry Date</label>
                <input type="month" id="expiry">
                
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" placeholder="123">
                
                <button type="submit">Confirm Payment</button>
            </form>
        </div>
    </div>
    
    <script>
        function openPaymentModal() {
            document.getElementById('paymentModal').style.display = 'flex';
        }
        function closePaymentModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }
    </script>
</body>
</html>
