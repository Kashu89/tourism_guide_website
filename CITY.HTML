<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beach Images</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
        background-color: #f4f4f4;
    }
    h2 {
        color: #333;
    }
    .image-gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        padding: 10px;
    }
    .image-gallery img {
        width: 100%;
        max-width: 400px;
        height: auto;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease;
    }
    .image-gallery img:hover {
        transform: scale(1.05);
    }
    a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #007BFF;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-size: 16px;
    }
    a:hover {
        background-color: #0056b3;
    }
</style>
</head>
<body>
    <h2>Beautiful CITIES </h2>
    <div class="image-gallery">
        <img src="https://www.mistay.in/travel-blog/content/images/2020/07/travel-4813658_1920.jpg" alt="Beach View 1">
        <img src="https://e0.pxfuel.com/wallpapers/916/704/desktop-wallpaper-india-city-indian-city.jpg" alt="Beach View 2">
        <img src="https://wallpapercave.com/wp/wp7658963.jpg" alt="Beach View 3">
        <img src="https://res.cloudinary.com/lastminute-contenthub/s--vilqQLMx--/c_limit,h_999999,w_1920/f_auto/q_auto:eco/v1/DAM/Photos/Destinations/Asia/India/eyeem-23764952-85249318" alt="Beach View 4">
    </div>
    <a href="html1.html">Back to Home</a>  <!-- Button to go back -->
</body>
</html>
