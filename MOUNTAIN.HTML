<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mountains Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h2 {
            color: #333;
        }
        .image-gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 10px;
        }
        .image-gallery img {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        .image-gallery img:hover {
            transform: scale(1.05);
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h2>Beautiful mountains tours </h2>
    <div class="image-gallery">
        <img src="https://pepnewz.com/wp-content/uploads/trek-1443592840-800-850x491.jpg" alt="Mountain1">
        <img src="https://www.tusktravel.com/blog/wp-content/uploads/2023/03/Top-Highest-Mountain-Peaks-In-India.jpg" alt="Mountain 2">
        <img src="https://news4masses.com/wp-content/uploads/2021/07/photography-of-mountains-and-trees-india.jpg" alt="Mountain 3">
        <img src="https://www.shikhar.com/blog/wp-content/uploads/2019/11/Untitled.jpg" alt="Mountain4">
    </div>
    <a href="html1.html">Back to Home</a>  <!-- Button to go back -->
</body>
</html>
